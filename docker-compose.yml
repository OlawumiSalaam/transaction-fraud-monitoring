# One-command reproducible environment: database + online-path API + workspace.
# `docker compose up` brings up the stack; the API runs migrations on start.
# The LLM is disabled by default, so the stack runs on the templated pathway
# (graceful-degradation floor) until a provider is configured.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tfm
      POSTGRES_PASSWORD: tfm
      POSTGRES_DB: tfm
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfm"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      LOG_FORMAT: json
      DATABASE_URL: postgresql+psycopg://tfm:tfm@db:5432/tfm
      CONFIG_DIR: config
      LLM_ENABLED: "false"
    ports:
      - "8000:8000"
    # Apply migrations, then serve. (Business routes are added per milestone.)
    command: >
      sh -c "alembic upgrade head &&
             uvicorn tfm.api.app:app --host 0.0.0.0 --port 8000"

  web:
    build: .
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    command: >
      streamlit run src/tfm/web/app.py
      --server.port 8501 --server.address 0.0.0.0

volumes:
  db_data:
