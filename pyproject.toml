[project]
name = "transaction-fraud-monitoring"
version = "0.0.0"
description = "Transaction Fraud Monitoring — case investigation workspace (Version 1)"
requires-python = ">=3.11"
readme = "README.md"

# Runtime dependencies for the online path scaffold (M0).
# The ML/evaluation stack is declared under [project.optional-dependencies].ml
# and pulled in at M1/M2. No LLM SDK is declared yet; the provider is chosen at M6.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "streamlit>=1.58",
    # Data-processing layer (M1+). Not ML-specific; needed in CI for feature
    # engineering and ingestion tests. scikit-learn and lightgbm remain in [ml].
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
# ML scorer, calibration, leakage gate (M2+).
ml = [
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
]
# Developer tooling.
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfm"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# Stubs for future milestones intentionally contain no logic yet.
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["tfm", "evaluation"]

[tool.mypy]
python_version = "3.11"
files = ["src/tfm", "evaluation"]
# Strict on the codebase; scaffolding is fully typed.
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]
filterwarnings = [
    # Third-party: FastAPI/Starlette TestClient httpx integration deprecation.
    "ignore:Using `httpx` with `starlette.testclient`",
    # Third-party: LightGBM predicts on a numpy matrix (features are positional).
    "ignore:X does not have valid feature names:UserWarning",
]

[tool.coverage.run]
source = ["tfm"]
branch = true

[tool.coverage.report]
show_missing = true
