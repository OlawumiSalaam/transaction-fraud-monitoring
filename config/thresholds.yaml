# Score-band thresholds mapped by the recommendation policy. [FR-9]
#
# These are PLACEHOLDER defaults. The cost-model justification and sensitivity
# analysis that set them are produced in M2/M5 (governance-first threshold
# selection, §11.2). A governance owner ultimately sets these values; the product
# exposes them as a knob and does not claim an objectively correct operating point.
#
# band = low        if score < low_max
#      = high        if score >= high_min
#      = borderline  otherwise   (borderline defaults the recommendation toward hold)

score_bands:
  low_max: 0.30
  high_min: 0.80
